name: DynamicTools
version: '${version}'

main: us.to.midensthings.dynamicTools.DynamicTools
api-version: '26.1'
folia-supported: true
load: POSTWORLD

dependencies:
  server:
    ItemsAdder:
      join-classpath: true
      load: AFTER
      required: false
    CraftEngine:
      join-classpath: true
      load: AFTER
      required: false

permissions:
  dynamictools.commands.debug:
    default: op
  dynamictools.commands.give:
    default: op
  dynamictools.commands.open:
    default: op
  dynamictools.commands.inspect:
    default: true
  dynamictools.commands.generatetextures:
    default: op
  dynamictools.commands.reload:
    default: op
  dynamictools.commands.addmodifier:
    default: op
  dynamictools.commands.rebuild:
    default: op
  dynamictools.commands.open.others:
    default: op