# Heads dropped by the Beheading modifier for mobs that don't have a vanilla head.
# Zombies, skeletons, wither skeletons, creepers, piglins, the ender dragon and players already drop their vanilla heads
# and don't need an entry here. Mobs without a vanilla head or an entry here don't drop anything.
#
# Each entry is an entity type, as used in /summon (e.g. cow, iron_golem), with:
#   texture: the head's skin. Either the texture ID (the long hex string at the end of a textures.minecraft.net URL)
#            or the full base64 "Value" that head websites give you.
#   name: (optional) the head's name, MiniMessage formatting is supported. Defaults to "<mob name> Head".
#
# Textures can be found on head websites such as https://minecraft-heads.com. Check the website's terms before
# copying heads from it.
