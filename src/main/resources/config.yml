config-version: '1.0'

block-vanilla-tools: false
# Whether or not to prevent the crafting of vanilla tools (including netherite upgrades in the smithing table and maces).
# Repairing vanilla tools by combining them still works.

block-vanilla-armor: false
# Whether or not to prevent the crafting of vanilla armor (including netherite upgrades in the smithing table).
# Repairing vanilla armor and armor trims still work.

preferred-custom-item-plugin: ItemsAdder
# Options: CraftEngine, ItemsAdder
# DT will try to use whatever plugin you list, but if the plugin isn't found it will fall back to whatever option it can find.

resource-pack:
  generate: true
  # Generate part and tool textures from each material's colors and add them to the custom item plugin's resource pack.
  # If false, parts use the custom item plugin's models and tools look like vanilla tools.

debug-mode: false
# When debug mode is set to true, the plugin will log more details about its usage. This should remain FALSE for the majority of servers.

part-crafter:
  share-smithing-table: false
  # Clicking on a smithing table prompts the user to choose between the vanilla GUI or the Part Crafter GUI
  replace-smithing-table: false
  # Clicking on a smithing table opens the Part Crafter GUI. Takes priority over share-smithing-table.
  # If both are false, smithing tables work like vanilla and the Part Crafter can only be opened with /dt open.
  custom-block: true
  # Add the block to the custom item plugin: its config and textures are copied into ItemsAdder or CraftEngine,
  # which makes the block and its resource pack. Right-clicking the placed block opens the GUI. Needs a restart, then /iazip or /ce reload all.
  gui:
    title: "Part Crafter"
    # MiniMessage formatting is supported
    fill-empty-slots: true
    # Fill the unused slots with the fill material
    fill-material: GRAY_STAINED_GLASS_PANE
    pointer-material: ARROW
    # Item between the input slot and the parts


assembler:
  share-anvil: false
  # Clicking on an anvil prompts the user to choose between the vanilla GUI or the Part Assembler GUI
  replace-anvil: false
  # Clicking on an anvil opens the Part Assembler GUI. Takes priority over share-anvil.
  # If both are false, anvils work like vanilla and the Part Assembler can only be opened with /dt open.
  custom-block: true
  # Add the block to the custom item plugin: its config and textures are copied into ItemsAdder or CraftEngine,
  # which makes the block and its resource pack. Right-clicking the placed block opens the GUI. Needs a restart, then /iazip or /ce reload all.
  gui:
    title: "Part Assembler"
    # MiniMessage formatting is supported
    fill-empty-slots: true
    # Fill the unused slots with the fill material
    fill-material: GRAY_STAINED_GLASS_PANE
    pointer-material: ARROW
    # Item between the part slots and the result slot