info:
  namespace: dynamictools
# Parts reuse vanilla models (generate: false + model_path), so ItemsAdder does not generate any textures or models for them.
items:
  binding:
    enabled: true
    name: "Binding"
    resource:
      material: PAPER
      generate: false
      model_path: minecraft:item/string
  handle:
    enabled: true
    name: "Handle"
    resource:
      material: PAPER
      generate: false
      model_path: minecraft:item/stick

  # Tools (handle + binding + tool head = complete piece)
