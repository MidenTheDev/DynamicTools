# The Part Assembler block for CraftEngine, the same as the ItemsAdder version.
# Its textures are installed into this pack's resourcepack/assets/dynamictools/textures/block folder.
items:
  dynamictools:part_assembler:
    material: paper
    # Shows the block model in the inventory
    model: dynamictools:block/part_assembler
    data:
      item_name: "Part Assembler"
    behavior:
      type: block_item
      block: dynamictools:part_assembler

blocks:
  dynamictools:part_assembler:
    states:
      # "facing" makes the block face the player when placed, like a furnace
      properties:
        facing:
          type: horizontal_direction
          default: north
      appearances:
        north:
          auto_state: note_block
          model:
            path: dynamictools:block/part_assembler
            # Texture order: bottom, top, front, side
            textures:
              - dynamictools:block/part_assembler_bottom
              - dynamictools:block/part_assembler_top
              - dynamictools:block/part_assembler_front
              - dynamictools:block/part_assembler_side
        east:
          auto_state: note_block
          model:
            path: dynamictools:block/part_assembler
            y: 90
        south:
          auto_state: note_block
          model:
            path: dynamictools:block/part_assembler
            y: 180
        west:
          auto_state: note_block
          model:
            path: dynamictools:block/part_assembler
            y: 270
      variants:
        facing=north:
          appearance: north
        facing=east:
          appearance: east
        facing=south:
          appearance: south
        facing=west:
          appearance: west
    events:
      - on: right_click
        functions:
          # Runs as the console by default
          - type: command
            command: "dt open partAssembler <arg:player.name>"

recipes:
  dynamictools:part_assembler:
    type: shaped
    pattern:
      - "CC"
      - "PP"
      - "PP"
    ingredients:
      C: "minecraft:copper_ingot"
      P: "#minecraft:planks"
    result:
      id: dynamictools:part_assembler
      count: 1
