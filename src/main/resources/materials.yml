# materials: the items that can be crafted into parts of this material in the Part Crafter
#   "#minecraft:planks"  - every item in an item tag
#   "minecraft:stick"    - a vanilla item
#   "my_items:ruby"      - an ItemsAdder or CraftEngine custom item, by its namespaced ID
#   If an item is an input for more than one material, the material listed first in this file is used.
# colors: (optional) hex colors the part textures are recolored with. The darkest pixels become dark, the highlights light.
#   Materials without colors use the uncolored base textures.
# stats.armorDurability: the durability of armor made with this material, separate from tool durability.
#   Use vanilla's armor durability multipliers to match vanilla armor: leather 5, gold 7, copper 11, iron/chainmail 15,
#   diamond 33, netherite 37. Defaults to 15. Armor also uses the durability multiplier.
# modifiers: (optional) the modifiers tools made with this material get, as modifier ID: level
#   Each modifier only applies to the tool types it supports (e.g. frigid only goes on weapons), so a material can list
#   separate modifiers for different kinds of tools.
#   Levels add up with the same modifier from the tool's other materials. A material used in more than one part only counts once.
#   e.g.
#   modifiers:
#     reinforced: 1
#     frigid: 2
wood:
  display-name: "<#b5835a>Wooden</#b5835a>"
  colors:
    light: "#c29d62"
    medium: "#896727"
    dark: "#3d2b12"
  materials:
    - "#minecraft:wooden_tool_materials"
  stats:
    durability: 30
    attackDamage: 2
    attackSpeed: 0.8
    digSpeed: 1
    miningLevel: 1
  multipliers:
    durability: 1.0
    attackDamage: 1.0
    attackSpeed: 1.0
    digSpeed: 1.0
    armor: 1.0
    armorToughness: 1.0
  part-blacklist:
    - ARMOR_CORE
    - ARMOR_BINDING
    - HELMET_FRAME
    - CHESTPLATE_FRAME
    - LEGGINGS_FRAME
    - BOOTS_FRAME

